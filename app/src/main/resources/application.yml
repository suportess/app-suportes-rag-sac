server:
  port: 8080

spring:
  application:
    name: sap-spec-validator

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/spec_validator}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.company.specvalidator: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

app:
  storage:
    base-path: ${STORAGE_PATH:./uploads}

  ai:
    provider: openai
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4.1-mini}
      temperature: 0.0
      timeout-seconds: 120
      max-retries: 3

  # Pesos por criterio do checklist (definidos pelo negocio - Marcio/Manu - em 2026-07-27/28).
  # "consistencia" nao entra aqui: saiu do checklist pontuado e virou regra geral no prompt.
  scoring:
    parcial-multiplier: 0.5
    pesos:
      descricao_processo: 3
      objetivo_escopo: 4
      casos_uso: 4
      fluxos_alternativos: 5
      regras_negocio: 5
      tratamento_excecoes: 3
      inputs_outputs: 4
      condicoes_teste: 4
      massa_dados: 5
      campos_estrutura_dados: 3
      dependencias: 3
      controle_acesso: 3
      volume_frequencia: 3
      logs_reprocessamento: 3
      mensagens_validacoes: 3

langfuse:
  enabled: ${LANGFUSE_ENABLED:true}
  host: ${LANGFUSE_HOST:https://cloud.langfuse.com}
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  environment: ${LANGFUSE_ENVIRONMENT:local}
  prompt-name: ${LANGFUSE_PROMPT_NAME:promptBuilderService}
